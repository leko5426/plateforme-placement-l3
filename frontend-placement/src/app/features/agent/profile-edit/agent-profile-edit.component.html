@if (chargement()) {
  <app-loading-spinner message="Chargement de votre profil…" />
} @else {
  <div class="mb-4">
    <h3 class="mb-1">Mon agence</h3>
    <p class="text-muted mb-0">Ces informations sont visibles publiquement sur votre fiche.</p>
    @if (agent?.urlPersonnalisee) {
      <p class="small text-teal mb-0"><i class="bi bi-link-45deg"></i> plateforme.ci/agences/{{ agent?.urlPersonnalisee }}</p>
    }
  </div>

  <div class="card" style="max-width: 640px;">
    <div class="card-body p-4">
      <form #f="ngForm" (ngSubmit)="soumettre(f)">
        <div class="text-center mb-4">
          <label for="logo" class="cursor-pointer">
            @if (apercuLogo()) {
              <img [src]="apercuLogo()" class="avatar avatar--lg" alt="Logo" />
            } @else {
              <div class="avatar avatar--lg d-flex align-items-center justify-content-center mx-auto">
                <i class="bi bi-building text-teal fs-4"></i>
              </div>
            }
            <p class="small text-muted mt-2 mb-0">Changer le logo</p>
          </label>
          <input type="file" id="logo" accept="image/*" class="d-none" (change)="surChangementLogo($event)" />
        </div>

        <div class="mb-3">
          <label class="form-label">Nom de l'agence *</label>
          <input type="text" class="form-control" name="nomAgence" required [(ngModel)]="modele.nomAgence" />
        </div>
        <div class="mb-3">
          <label class="form-label">Localisation *</label>
          <input type="text" class="form-control" name="localisation" required [(ngModel)]="modele.localisation" />
        </div>
        <div class="mb-4">
          <label class="form-label">Description</label>
          <textarea class="form-control" name="description" rows="4" [(ngModel)]="modele.description"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="enEnvoi()">
          @if (enEnvoi()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Enregistrer les modifications
        </button>
      </form>
    </div>
  </div>
}
