<section class="auth-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card auth-card">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <span class="brand-mark-lg"><i class="bi bi-house-heart-fill"></i></span>
              <h3 class="mt-3 mb-0">Content de te revoir</h3>
              <p class="text-muted">Connecte-toi à ton espace</p>
            </div>

            <form #f="ngForm" (ngSubmit)="soumettre(f)">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required [(ngModel)]="email" />
              </div>
              
              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label class="form-label mb-0">Mot de passe</label>
                  <a routerLink="/mot-de-passe-oublie" class="text-decoration-none small text-primary">Mot de passe oublié ?</a>
                </div>
                <input type="password" class="form-control" name="password" required [(ngModel)]="password" />
              </div>
              
              <button type="submit" class="btn btn-primary w-100" [disabled]="enEnvoi()">
                @if (enEnvoi()) {
                  <span class="spinner-border spinner-border-sm me-2"></span>
                }
                Se connecter
              </button>
            </form>

            <p class="text-center text-muted small mt-4 mb-0">
              Pas encore de compte ?
              <a routerLink="/inscription/candidate">Candidate</a> ·
              <a routerLink="/inscription/agent">Agent de placement</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
